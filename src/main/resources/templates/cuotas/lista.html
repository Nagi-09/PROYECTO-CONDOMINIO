<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuotas - Sistema de Condominio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <h1>Gestión de Cuotas</h1>

    <p class="acciones-lista">
        <a class="boton" th:href="@{/cuotas/nuevo}">Registrar nueva cuota</a>
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Vivienda</th>
                <th>Concepto</th>
                <th>Periodo</th>
                <th>Monto</th>
                <th>Pagado</th>
                <th>Saldo</th>
                <th>Vencimiento</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="cuota : ${cuotas}">

                <td th:text="${cuota.idCuota}"></td>

                <td th:text="${cuota.vivienda != null
                        ? cuota.vivienda.numero + ' (' + cuota.vivienda.bloque + ')'
                        : '-'}"></td>

                <td th:text="${cuota.concepto != null
                        ? cuota.concepto.nombre : '-'}"></td>

                <td th:text="${cuota.periodo}"></td>

                <td th:text="'Q' + ${cuota.monto}"></td>

                <td th:text="'Q' + ${cuota.montoPagado}"></td>

                <td th:text="'Q' + ${cuota.saldoPendiente}"></td>

                <td th:text="${cuota.fechaVencimiento}"></td>

                <td>
                    <span th:text="${cuota.estado}"></span>
                    <span th:if="${cuota.esParcial()}">(parcial)</span>
                </td>

                <td>

                    <a th:href="@{/cuotas/editar/{id}(id=${cuota.idCuota})}">
                        Editar
                    </a>

                    <form class="accion-tabla"
                          th:action="@{/cuotas/eliminar/{id}(id=${cuota.idCuota})}"
                          method="post">
                        <button type="submit"
                                class="boton-chico peligro"
                                onclick="return confirm('¿Eliminar esta cuota? Si tiene pagos registrados, no se podrá eliminar.')">
                            Eliminar
                        </button>
                    </form>

                    <a class="boton-chico"
                       th:href="@{/pagos/nuevo?cuotaId={id}(id=${cuota.idCuota})}">
                        Pagar
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</body>

</html>
