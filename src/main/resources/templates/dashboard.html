<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel principal - Sistema de Condominio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header class="topbar">

        <span class="marca">Sistema de Condominio</span>

        <span class="sesion">
            <span th:text="${session.usuario.nombreCompleto}"></span>
            (<span th:text="${session.usuario.rol != null
                    ? session.usuario.rol.nombre : 'Sin rol'}"></span>)
            <a th:href="@{/logout}">Salir</a>
        </span>

    </header>

    <main class="contenedor">

        <h1 class="titulo">Panel principal</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <p class="ok" th:if="${param.denegado}">
            No tienes permiso para acceder a esa sección.
        </p>

        <h2>Resumen del condominio</h2>

        <div class="grid">

            <a class="card" th:href="@{/personas}">
                <div class="numero" th:text="${totalPersonas}"></div>
                <div class="etiqueta">Personas</div>
            </a>

            <a class="card" th:href="@{/viviendas}">
                <div class="numero" th:text="${totalViviendas}"></div>
                <div class="etiqueta">Viviendas</div>
            </a>

            <a class="card" th:href="@{/vehiculos}">
                <div class="numero" th:text="${totalVehiculos}"></div>
                <div class="etiqueta">Vehículos</div>
            </a>

            <a class="card" th:href="@{/vivienda-persona}">
                <div class="numero" th:text="${totalRelaciones}"></div>
                <div class="etiqueta">Vivienda - Persona</div>
            </a>

            <a class="card" th:href="@{/cuotas}">
                <div class="numero" th:text="${totalCuotas}"></div>
                <div class="etiqueta">Cuotas</div>
            </a>

            <a class="card" th:href="@{/pagos}">
                <div class="numero" th:text="${totalPagos}"></div>
                <div class="etiqueta">Pagos</div>
            </a>

            <a class="card" th:href="@{/notificaciones}">
                <div class="numero" th:text="${totalNotificaciones}"></div>
                <div class="etiqueta">Notificaciones</div>

                <div class="badge"
                     th:if="${notificacionesPendientes > 0}"
                     th:text="${notificacionesPendientes} + ' sin atender'">
                </div>
            </a>

        </div>

        <div th:if="${session.usuario.rol != null
                and session.usuario.rol.esAdministrador()}">

            <h2>Administración</h2>

            <div class="grid">

                <a class="card" th:href="@{/usuarios}">
                    <div class="numero" th:text="${totalUsuarios}"></div>
                    <div class="etiqueta">Usuarios del sistema</div>
                </a>

                <div class="card">
                    <div class="numero" th:text="${totalAdministradores}"></div>
                    <div class="etiqueta">Administradores</div>
                </div>

                <div class="card">
                    <div class="numero" th:text="${totalPersonalAdministrativo}"></div>
                    <div class="etiqueta">Personal Administrativo</div>
                </div>

                <div class="card">
                    <div class="numero" th:text="${totalEncargadosCobros}"></div>
                    <div class="etiqueta">Encargados de Cobros</div>
                </div>

            </div>

        </div>

    </main>

</body>

</html>
