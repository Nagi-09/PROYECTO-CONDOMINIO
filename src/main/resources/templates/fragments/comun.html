<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <header class="topbar" th:fragment="barra">

        <span class="marca">
            <a th:href="@{/dashboard}"
               style="color: #ffffff; font-weight: 700;">
                Sistema de Condominio
            </a>
        </span>

        <span class="sesion">
            <span th:text="${session.usuario != null
                    ? session.usuario.nombreCompleto : ''}"></span>
            <a th:href="@{/dashboard}">Panel</a>
            <a th:href="@{/logout}">Salir</a>
        </span>

    </header>

</body>

</html>
