<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Persona</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

        <h1 class="titulo">Formulario de Persona</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form class="formulario"
              th:action="@{/personas/guardar}"
              th:object="${persona}"
              method="post">

            <input type="hidden" th:field="*{idPersona}">

            <label>Nombres:</label>
            <input type="text"
                   th:field="*{nombres}"
                   maxlength="100"
                   required>

            <label>Apellidos:</label>
            <input type="text"
                   th:field="*{apellidos}"
                   maxlength="100"
                   required>

            <label>DPI:</label>
            <input type="text"
                   th:field="*{dpi}"
                   maxlength="20"
                   required>
            <small>No se puede repetir entre personas.</small>

            <label>Teléfono:</label>
            <input type="text"
                   th:field="*{telefono}"
                   maxlength="20">

            <label>Correo:</label>
            <input type="email"
                   th:field="*{correo}"
                   maxlength="150">

            <label>Fecha de nacimiento:</label>
            <input type="date"
                   th:field="*{fechaNacimiento}">

            <label>Estado:</label>
            <select th:field="*{estado}" required>
                <option value="true">Activa</option>
                <option value="false">Inactiva</option>
            </select>

            <div class="acciones">
                <button type="submit" class="principal">Guardar</button>
                <a th:href="@{/personas}">Cancelar</a>
            </div>

        </form>

    </main>

</body>

</html>
