<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema de Condominio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header class="topbar">
        <span class="marca">Sistema de Condominio</span>
        <span class="sesion">
            <span th:text="${session.usuario.nombreCompleto}"></span>
            (<span th:text="${session.usuario.rol != null
                    ? session.usuario.rol.nombre : 'Sin rol'}"></span>)
            <a th:href="@{/dashboard}">Panel</a>
            <a th:href="@{/logout}">Salir</a>
        </span>
    </header>

    <main class="contenedor">

        <h1 class="titulo">Usuarios del sistema</h1>

        <p class="acciones-lista">
            <a class="boton" th:href="@{/usuarios/nuevo}">Registrar nuevo usuario</a>
        </p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.idUsuario}"></td>

                    <td th:text="${usuario.nombreCompleto}"></td>

                    <td th:text="${usuario.username}"></td>

                    <td th:text="${usuario.correo}"></td>

                    <td th:text="${usuario.rol != null
                            ? usuario.rol.nombre : '-'}"></td>

                    <td th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></td>

                    <td>
                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">
                            Editar
                        </a>

                        <form class="accion-tabla"
                              th:action="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                              method="post">
                            <button type="submit"
                                    class="boton-chico peligro"
                                    onclick="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                                Eliminar
                            </button>
                        </form>
                    </td>

                </tr>

            </tbody>

        </table>

    </main>

</body>

</html>
