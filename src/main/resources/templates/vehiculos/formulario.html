<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Vehículo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

        <h1 class="titulo">Formulario de Vehículo</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form class="formulario"
              th:action="@{/vehiculos/guardar}"
              method="post">

            <input type="hidden"
                   name="idVehiculo"
                   th:value="${vehiculo.idVehiculo}">

            <label>Vivienda:</label>
            <select name="viviendaId" required>
                <option value="">Seleccione una vivienda</option>

                <option th:each="vivienda : ${viviendas}"
                        th:value="${vivienda.idVivienda}"
                        th:text="${vivienda.numero + ' - Bloque ' + vivienda.bloque}"
                        th:selected="${vehiculo.vivienda != null
                                and vehiculo.vivienda.idVivienda == vivienda.idVivienda}">
                </option>
            </select>

            <label>Placa:</label>
            <input type="text"
                   name="placa"
                   th:value="${vehiculo.placa}"
                   maxlength="20"
                   required>

            <label>Marca:</label>
            <input type="text"
                   name="marca"
                   th:value="${vehiculo.marca}"
                   maxlength="50"
                   required>

            <label>Modelo:</label>
            <input type="text"
                   name="modelo"
                   th:value="${vehiculo.modelo}"
                   maxlength="50"
                   required>

            <label>Color:</label>
            <input type="text"
                   name="color"
                   th:value="${vehiculo.color}"
                   maxlength="30"
                   required>

            <label>Tipo:</label>
            <select name="tipo" required>
                <option value="">Seleccione</option>

                <!-- El valor va sin tilde porque es el que guardan los
                     datos originales de la base de datos -->
                <option value="Automovil"
                        th:selected="${vehiculo.tipo == 'Automovil'}">
                    Automóvil
                </option>

                <option value="Motocicleta"
                        th:selected="${vehiculo.tipo == 'Motocicleta'}">
                    Motocicleta
                </option>

                <option value="Pickup"
                        th:selected="${vehiculo.tipo == 'Pickup'}">
                    Pickup
                </option>

                <option value="Otro"
                        th:selected="${vehiculo.tipo == 'Otro'}">
                    Otro
                </option>
            </select>

            <label>Estado:</label>
            <select name="estado" required>
                <option value="true"
                        th:selected="${vehiculo.estado == true}">
                    Activo
                </option>

                <option value="false"
                        th:selected="${vehiculo.estado == false}">
                    Inactivo
                </option>
            </select>

            <div class="acciones">
                <button type="submit" class="principal">Guardar</button>
                <a th:href="@{/vehiculos}">Cancelar</a>
            </div>

        </form>

    </main>

</body>

</html>
