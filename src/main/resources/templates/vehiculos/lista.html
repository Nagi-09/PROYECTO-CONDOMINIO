<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - Sistema de Condominio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

    <h1 class="titulo">Gestión de Vehículos</h1>

    <p class="acciones-lista">
        <a class="boton" th:href="@{/vehiculos/nuevo}">Registrar nuevo vehículo</a>
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Vivienda</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Color</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="vehiculo : ${vehiculos}">

                <td th:text="${vehiculo.idVehiculo}"></td>

                <td th:text="${vehiculo.vivienda.numero + ' - Bloque ' + vehiculo.vivienda.bloque}">
                </td>

                <td th:text="${vehiculo.placa}"></td>

                <td th:text="${vehiculo.marca}"></td>

                <td th:text="${vehiculo.modelo}"></td>

                <td th:text="${vehiculo.color}"></td>

                <td th:text="${vehiculo.tipo}"></td>

                <td th:text="${vehiculo.estado ? 'Activo' : 'Inactivo'}">
                </td>

                <td>

                    <a th:href="@{/vehiculos/editar/{id}(id=${vehiculo.idVehiculo})}">
                        Editar
                    </a>

                    <form class="accion-tabla"
                          th:action="@{/vehiculos/eliminar/{id}(id=${vehiculo.idVehiculo})}"
                          method="post">
                        <button type="submit"
                                class="boton-chico peligro"
                                onclick="return confirm('¿Eliminar este vehículo? Esta acción no se puede deshacer.')">
                            Eliminar
                        </button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

    </main>

</body>

</html>
