<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relación Vivienda - Persona</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

        <h1 class="titulo">Relación Vivienda - Persona</h1>

        <p class="acciones-lista">
            Asigna una persona a una vivienda. Los tipos válidos son los que
            acepta la base de datos: Propietario, Residente, Inquilino o Familiar.
        </p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form class="formulario"
              th:action="@{/vivienda-persona/guardar}"
              method="post">

            <input type="hidden"
                   name="idViviendaPersona"
                   th:value="${relacion.idViviendaPersona}">

            <label>Vivienda:</label>
            <select name="viviendaId" required>
                <option value="">Seleccione una vivienda</option>

                <option th:each="vivienda : ${viviendas}"
                        th:value="${vivienda.idVivienda}"
                        th:text="${vivienda.numero + ' - Bloque ' + vivienda.bloque}"
                        th:selected="${relacion.vivienda != null
                                and relacion.vivienda.idVivienda == vivienda.idVivienda}">
                </option>
            </select>

            <label>Persona:</label>
            <select name="personaId" required>
                <option value="">Seleccione una persona</option>

                <option th:each="persona : ${personas}"
                        th:value="${persona.idPersona}"
                        th:text="${persona.nombres + ' ' + persona.apellidos}"
                        th:selected="${relacion.persona != null
                                and relacion.persona.idPersona == persona.idPersona}">
                </option>
            </select>

            <label>Tipo de relación:</label>
            <select name="tipoRelacion" required>
                <option value="">Seleccione</option>
                <option value="Propietario"
                        th:selected="${relacion.tipoRelacion == 'Propietario'}">
                    Propietario
                </option>
                <option value="Residente"
                        th:selected="${relacion.tipoRelacion == 'Residente'}">
                    Residente
                </option>
                <option value="Inquilino"
                        th:selected="${relacion.tipoRelacion == 'Inquilino'}">
                    Inquilino
                </option>
                <option value="Familiar"
                        th:selected="${relacion.tipoRelacion == 'Familiar'}">
                    Familiar
                </option>
            </select>

            <label>Fecha de inicio:</label>
            <input type="date"
                   name="fechaInicio"
                   th:value="${relacion.fechaInicio}"
                   required>

            <label>Fecha de fin:</label>
            <input type="date"
                   name="fechaFin"
                   th:value="${relacion.fechaFin}">
            <small>Vacío si la persona todavía vive ahí.</small>

            <label>Estado:</label>
            <select name="estado" required>
                <option value="true"
                        th:selected="${relacion.estado == true}">
                    Activa
                </option>
                <option value="false"
                        th:selected="${relacion.estado == false}">
                    Inactiva
                </option>
            </select>

            <div class="acciones">
                <button type="submit" class="principal">Guardar</button>
                <a th:href="@{/vivienda-persona}">Cancelar</a>
            </div>

        </form>

    </main>

</body>

</html>
