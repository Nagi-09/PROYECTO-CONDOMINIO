<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relaciones Vivienda-Persona</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

    <h1 class="titulo">Relaciones Vivienda - Persona</h1>

    <p class="acciones-lista">
        <a class="boton" th:href="@{/vivienda-persona/nuevo}">Registrar nueva relación</a>
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Vivienda</th>
                <th>Persona</th>
                <th>Tipo de relación</th>
                <th>Fecha inicio</th>
                <th>Fecha fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="relacion : ${relaciones}">

                <td th:text="${relacion.idViviendaPersona}"></td>

                <td th:text="${relacion.vivienda.numero + ' - Bloque ' + relacion.vivienda.bloque}">
                </td>

                <td th:text="${relacion.persona.nombres + ' ' + relacion.persona.apellidos}">
                </td>

                <td th:text="${relacion.tipoRelacion}"></td>

                <td th:text="${relacion.fechaInicio}"></td>

                <td th:text="${relacion.fechaFin != null ? relacion.fechaFin : 'Sin fecha'}">
                </td>

                <td th:text="${relacion.estado ? 'Activa' : 'Inactiva'}">
                </td>

                <td>

                    <a th:href="@{/vivienda-persona/editar/{id}(id=${relacion.idViviendaPersona})}">
                        Editar
                    </a>

                    <form class="accion-tabla"
                          th:action="@{/vivienda-persona/eliminar/{id}(id=${relacion.idViviendaPersona})}"
                          method="post">
                        <button type="submit"
                                class="boton-chico peligro"
                                onclick="return confirm('¿Eliminar esta asignación de vivienda? Esta acción no se puede deshacer.')">
                            Eliminar
                        </button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

    </main>

</body>

</html>
