<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Vivienda</title>
</head>

<body>

    <h1>Formulario de Vivienda</h1>

    <form th:action="@{/viviendas/guardar}"
          th:object="${vivienda}"
          method="post">

        <input type="hidden" th:field="*{idVivienda}">

        <div>
            <label>Número:</label>
            <input type="text"
                   th:field="*{numero}"
                   required>
        </div>

        <br>

        <div>
            <label>Bloque:</label>
            <input type="text"
                   th:field="*{bloque}"
                   required>
        </div>

        <br>

        <div>
            <label>Dirección:</label>
            <input type="text"
                   th:field="*{direccion}"
                   required>
        </div>

        <br>

        <div>
            <label>Estado:</label>

            <select th:field="*{estado}" required>
                <option value="">Seleccione</option>
                <option value="Ocupada">Ocupada</option>
                <option value="Disponible">Disponible</option>
                <option value="Mantenimiento">Mantenimiento</option>
            </select>
        </div>

        <br>

        <button type="submit">
            Guardar
        </button>

        <a th:href="@{/viviendas}">
            Cancelar
        </a>

    </form>

</body>

</html>
