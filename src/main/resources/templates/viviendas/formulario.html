<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Vivienda</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

        <h1 class="titulo">Formulario de Vivienda</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form class="formulario"
              th:action="@{/viviendas/guardar}"
              th:object="${vivienda}"
              method="post">

            <input type="hidden" th:field="*{idVivienda}">

            <label>Número:</label>
            <input type="text"
                   th:field="*{numero}"
                   maxlength="20"
                   required>

            <label>Bloque:</label>
            <input type="text"
                   th:field="*{bloque}"
                   maxlength="20"
                   required>

            <label>Dirección:</label>
            <input type="text"
                   th:field="*{direccion}"
                   maxlength="200"
                   required>

            <label>Estado:</label>
            <select th:field="*{estado}" required>
                <option value="">Seleccione</option>
                <option value="Ocupada">Ocupada</option>
                <option value="Disponible">Disponible</option>
                <option value="Mantenimiento">Mantenimiento</option>
            </select>

            <div class="acciones">
                <button type="submit" class="principal">Guardar</button>
                <a th:href="@{/viviendas}">Cancelar</a>
            </div>

        </form>

    </main>

</body>

</html>
