<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viviendas - Sistema de Condominio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header th:replace="~{fragments/comun :: barra}"></header>

    <main class="contenedor">

    <h1 class="titulo">Gestión de Viviendas</h1>

    <p class="acciones-lista">
        <a class="boton" th:href="@{/viviendas/nuevo}">Registrar nueva vivienda</a>
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Número</th>
                <th>Bloque</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="vivienda : ${viviendas}">

                <td th:text="${vivienda.idVivienda}"></td>

                <td th:text="${vivienda.numero}"></td>

                <td th:text="${vivienda.bloque}"></td>

                <td th:text="${vivienda.direccion}"></td>

                <td th:text="${vivienda.estado}"></td>

                <td>

                    <a th:href="@{/viviendas/editar/{id}(id=${vivienda.idVivienda})}">
                        Editar
                    </a>

                    <form class="accion-tabla"
                          th:action="@{/viviendas/eliminar/{id}(id=${vivienda.idVivienda})}"
                          method="post">
                        <button type="submit"
                                class="boton-chico peligro"
                                onclick="return confirm('¿Eliminar esta vivienda? Puede quedar registrada en cuotas y pagos. Esta acción no se puede deshacer.')">
                            Eliminar
                        </button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

    </main>

</body>

</html>
